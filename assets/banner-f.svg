<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Aryan, AI / ML engineer. A language model generating the words: Hi, I'm Aryan.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF9F3"/><stop offset=".55" stop-color="#F7F3FF"/><stop offset="1" stop-color="#F0F8FF"/></linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="9"/></filter>
    <pattern id="rule" width="1000" height="36" patternUnits="userSpaceOnUse"><path d="M0 35.5H1000" stroke="#E7E0F7" stroke-width="1"/></pattern>
    <clipPath id="clip"><rect width="1000" height="360" rx="30"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SF Mono','Cascadia Code',Consolas,'Courier New',monospace; }
    .m1 { animation: d1 15s ease-in-out infinite alternate; } .m2 { animation: d2 18s ease-in-out infinite alternate; }
    @keyframes d1 { to { transform: translate(80px, 40px); } } @keyframes d2 { to { transform: translate(-70px, -30px); } }
    .chip, .panel, .cap { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.3,1.3,.5,1); opacity: 0; transform-box: fill-box; transform-origin: center; }
    .panel { animation-name: panel; animation-timing-function: ease-out; }
    .cap { animation-name: cap; animation-timing-function: ease-out; }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: bar 12s infinite ease-out; }
    .cursor { opacity: 0; animation: curshow 12s infinite; }
    .cursor rect { animation: blink 1s steps(2) infinite; }
    @keyframes c0{0%,3.97%{opacity:0;transform:translateY(14px) scale(.82)}5.37%{opacity:1;transform:translateY(0) scale(1)}90%{opacity:1;transform:none}95%,100%{opacity:0;transform:none}}@keyframes c1{0%,7.30%{opacity:0;transform:translateY(14px) scale(.82)}8.70%{opacity:1;transform:translateY(0) scale(1)}90%{opacity:1;transform:none}95%,100%{opacity:0;transform:none}}@keyframes c2{0%,12.30%{opacity:0;transform:translateY(14px) scale(.82)}13.70%{opacity:1;transform:translateY(0) scale(1)}90%{opacity:1;transform:none}95%,100%{opacity:0;transform:none}}@keyframes c3{0%,15.63%{opacity:0;transform:translateY(14px) scale(.82)}17.03%{opacity:1;transform:translateY(0) scale(1)}90%{opacity:1;transform:none}95%,100%{opacity:0;transform:none}}@keyframes c4{0%,26.47%{opacity:0;transform:translateY(14px) scale(.82)}27.87%{opacity:1;transform:translateY(0) scale(1)}90%{opacity:1;transform:none}95%,100%{opacity:0;transform:none}}@keyframes c5{0%,29.80%{opacity:0;transform:translateY(14px) scale(.82)}31.20%{opacity:1;transform:translateY(0) scale(1)}90%{opacity:1;transform:none}95%,100%{opacity:0;transform:none}}@keyframes c6{0%,33.13%{opacity:0;transform:translateY(14px) scale(.82)}34.53%{opacity:1;transform:translateY(0) scale(1)}90%{opacity:1;transform:none}95%,100%{opacity:0;transform:none}}@keyframes panel{0%,19.17%{opacity:0;transform:translateY(8px)}20.67%{opacity:1;transform:none}90%{opacity:1}95%,100%{opacity:0}}@keyframes bar{0%,21.67%{transform:scaleX(0)}27.50%{transform:scaleX(1)}90%{transform:scaleX(1)}95%,100%{transform:scaleX(0)}}@keyframes cap{0%,40.00%{opacity:0;transform:translateY(8px)}42.00%{opacity:1;transform:none}90%{opacity:1}95%,100%{opacity:0}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes curshow{0%,37.50%{opacity:0}38.33%,92%{opacity:1}95%,100%{opacity:0}}
  </style>

  <g clip-path="url(#clip)">
    <rect width="1000" height="360" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity=".7">
      <circle class="m1" cx="100" cy="330" r="110" fill="#FFD9C2"/>
      <circle class="m2" cx="900" cy="40" r="110" fill="#DCD3FF"/>
      <circle class="m1" cx="520" cy="0" r="80" fill="#CDEFE0"/>
    </g>
    <rect width="1000" height="360" fill="url(#rule)" opacity=".8"/>

    <!-- top bar -->
    <circle cx="52" cy="52" r="5" fill="#34C38F"/>
    <text class="mono" x="66" y="56" font-size="13" font-weight="700" fill="#8A7FB8" letter-spacing="1">generating…</text>
    <g class="mono" font-size="12.5" font-weight="700">
      <rect x="772" y="38" width="138" height="26" rx="13" fill="#fff" fill-opacity=".85" stroke="#E4DEF7"/><text x="841" y="55.5" text-anchor="middle" fill="#7C5CE7">temperature 0.2</text>
      <rect x="918" y="38" width="46" height="26" rx="13" fill="#fff" fill-opacity=".85" stroke="#E4DEF7" transform="translate(0 0)"/><text x="941" y="55.5" text-anchor="middle" fill="#E8734A">k=3</text>
    </g>

    <!-- EDIT: tokens (the words that get generated) -->
    
    <g class="chip" style="animation-name:c0">
      <rect x="76.0" y="94" width="124" height="114" rx="26" fill="#FFE0CC" stroke="#fff" stroke-width="3"/>
      <text x="138.0" y="178" text-anchor="middle" font-size="80" font-weight="800" fill="#2B2540">Hi</text>
    </g>
    <g class="chip" style="animation-name:c1">
      <rect x="204.0" y="94" width="70" height="114" rx="26" fill="#E8E0FF" stroke="#fff" stroke-width="3"/>
      <text x="239.0" y="178" text-anchor="middle" font-size="80" font-weight="800" fill="#2B2540">,</text>
    </g>
    <g class="chip" style="animation-name:c2">
      <rect x="298.0" y="94" width="70" height="114" rx="26" fill="#FFF3C4" stroke="#fff" stroke-width="3"/>
      <text x="333.0" y="178" text-anchor="middle" font-size="80" font-weight="800" fill="#2B2540">I</text>
    </g>
    <g class="chip" style="animation-name:c3">
      <rect x="372.0" y="94" width="134" height="114" rx="26" fill="#D9F6EA" stroke="#fff" stroke-width="3"/>
      <text x="439.0" y="178" text-anchor="middle" font-size="80" font-weight="800" fill="#2B2540">'m</text>
    </g>
    <g class="chip" style="animation-name:c4">
      <rect x="530.0" y="94" width="178" height="114" rx="26" fill="#FFD9E8" stroke="#fff" stroke-width="3"/>
      <text x="619.0" y="178" text-anchor="middle" font-size="80" font-weight="800" fill="#2B2540">Ary</text>
    </g>
    <g class="chip" style="animation-name:c5">
      <rect x="712.0" y="94" width="138" height="114" rx="26" fill="#DDEEFF" stroke="#fff" stroke-width="3"/>
      <text x="781.0" y="178" text-anchor="middle" font-size="80" font-weight="800" fill="#2B2540">an</text>
    </g>
    <g class="chip" style="animation-name:c6">
      <rect x="854.0" y="94" width="70" height="114" rx="26" fill="#E8E0FF" stroke="#fff" stroke-width="3"/>
      <text x="889.0" y="178" text-anchor="middle" font-size="80" font-weight="800" fill="#2B2540">.</text>
    </g>

    <!-- candidate panel -->
    <g class="panel" style="animation-name:panel">
      <rect x="519.0" y="226" width="200" height="92" rx="16" fill="#8E7FD0" opacity=".2" filter="url(#sh)" transform="translate(0 8)"/>
      <rect x="519.0" y="218" width="200" height="94" rx="16" fill="#fff" fill-opacity=".96" stroke="#E8E3F6" stroke-width="2"/>
      <text class="mono" x="533.0" y="236" font-size="10.5" font-weight="700" fill="#A59FBF" letter-spacing="2">NEXT TOKEN</text>
      
      <rect x="533.0" y="242" width="172" height="19" rx="9" fill="#F3EFFF"/>
      <rect class="bar" x="533.0" y="242" width="115.8" height="19" rx="9" fill="#8F7BFF" opacity="0.85"/>
      <text class="mono" x="543.0" y="256" font-size="12.5" font-weight="800" fill="#2B2540">Ary</text>
      <text class="mono" x="695.0" y="256" text-anchor="end" font-size="12.5" font-weight="800" fill="#2B2540">0.91</text>
      <rect x="533.0" y="264" width="172" height="19" rx="9" fill="#F3EFFF"/>
      <rect class="bar" x="533.0" y="264" width="8.0" height="19" rx="9" fill="#C9BFE8" opacity="0.7"/>
      <text class="mono" x="543.0" y="278" font-size="12.5" font-weight="500" fill="#2B2540">Ari</text>
      <text class="mono" x="695.0" y="278" text-anchor="end" font-size="12.5" font-weight="500" fill="#7A7396">0.05</text>
      <rect x="533.0" y="286" width="172" height="19" rx="9" fill="#F3EFFF"/>
      <rect class="bar" x="533.0" y="286" width="8.0" height="19" rx="9" fill="#C9BFE8" opacity="0.7"/>
      <text class="mono" x="543.0" y="300" font-size="12.5" font-weight="500" fill="#2B2540">Aar</text>
      <text class="mono" x="695.0" y="300" text-anchor="end" font-size="12.5" font-weight="500" fill="#7A7396">0.03</text>
    </g>

    <!-- EDIT: caption -->
    <g class="cap" style="animation-name:cap">
      <text x="78" y="340" font-size="19" font-weight="600" fill="#4B4568" textLength="640" lengthAdjust="spacing">AI / ML engineer  ·  I build the layer that makes LLMs trustworthy</text>
    </g>
    <g class="cursor"><rect x="726" y="322" width="10" height="22" rx="2" fill="#7C5CE7"/></g>
  </g>
  <rect x="1.5" y="1.5" width="997" height="357" rx="29" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="3"/>
</svg>